apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:3.6
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
          secretKeyRef:
            name: my-db-secret
            key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
          secretKeyRef:
            name: my-db-secret
            key: password
        - name: MONGO_INITDB_DATABASE
          valueFrom:
          secretKeyRef:
            name: my-db-secret
            key: project
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "gp3"
      resources:
        requests:
          storage: 20Gi