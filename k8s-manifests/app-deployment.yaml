apiVersion: v1
kind: Namespace
metadata:
  name: namegen
  labels:
    name: namegen
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: namegen-config
  namespace: namegen
data:
  NODE_ENV: "production"
  PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: namegen
type: Opaque
stringData:
  mongo-root-username: "root"
  mongo-root-password: "changeme"
  mongodb-uri: "mongodb://root:changeme@mongodb-service.namegen.svc.cluster.local:27017/namegen"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namegen-app
  namespace: namegen
  labels:
    app: namegen
    tier: application
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: namegen
      tier: application
  template:
    metadata:
      labels:
        app: namegen
        tier: application
    spec:
      containers:
      - name: namegen
        image: 929394210222.dkr.ecr.il-central-1.amazonaws.com/myapps/namegen:12b3c8158f44a1d2193de944724c7adce39901d1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: namegen-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: namegen-config
              key: PORT
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password
        - name: MONGODB_URL
          value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@10.100.42.19:27017/namegen?authSource=admin&app=namegen"
          
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"